<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose - Courtney or Sophia</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Which Daughter Should I Expropriate?</h1>
        
        <div class="choices-container">
            <div class="choice-card courtney-card">
                <span class="choice-emoji">🍕</span>
            </div>
            
            <button id="chooserBtn" class="chooser-btn">CHOOSE</button>
            
            <div class="choice-card sophia-card">
                <span class="choice-emoji">🍝</span>
            </div>
        </div>
        
        <div id="result" class="result"></div>
        
        <div class="italian-stripes">
            <div class="stripe green"></div>
            <div class="stripe white"></div>
            <div class="stripe red"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
